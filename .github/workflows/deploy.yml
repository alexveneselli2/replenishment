name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/gucci-replenishment-simulator-V8mfq

  # Permette l'esecuzione manuale dalla tab Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Esegue solo un deploy alla volta; cancella quello in coda se arriva uno nuovo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Accetta sia "VITE_ANTHROPIC_API_KEY" che "ANTHROPIC_API_KEY" come nome del secret
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
