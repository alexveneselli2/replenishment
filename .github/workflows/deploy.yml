name: CI Build

on:
  push:
    branches:
      - claude/gucci-replenishment-simulator-V8mfq
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify server entry
        run: node --input-type=module < server/index.js --check 2>/dev/null || node -e "import('./server/index.js').catch(()=>{})"
